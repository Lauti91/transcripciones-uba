name: Transcribir clases

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (hora UTC)
  workflow_dispatch:           # botón "Run workflow" para correrlo a mano
    inputs:
      prueba_materia:
        description: "MODO PRUEBA: materia (ej. DESARROLLO). Vacío = corrida normal."
        required: false
        default: ""
      prueba_groq_audio:
        description: "PRUEBA GROQ: audio sin extensión (ej. 27-08). Se guarda como '<audio> (groq)'."
        required: false
        default: ""
      prueba_correccion_audio:
        description: "PRUEBA CORRECCIÓN: clase ya transcripta (ej. 24-09). Se guarda como '<clase> (corregida)'."
        required: false
        default: ""
      recorregir_audio:
        description: "RECORREGIR EN EL LUGAR: clase (con su original en _partes) que se rehace y REEMPLAZA su Doc. Junto con prueba_materia."
        required: false
        default: ""
      max_pendientes:
        description: "Corrida normal: máximo de clases atrasadas a corregir (reemplaza el Doc en el lugar). Vacío = sin límite; 1 = prueba."
        required: false
        default: ""

# Nunca dos corridas normales a la vez: si una sigue en curso, la nueva espera.
# Los modos prueba van en otro grupo, así una corrida programada no los cancela
# mientras esperan (solo escriben "(groq)" / "(corregida)", no pisan nada).
concurrency:
  group: transcribir${{ (inputs.prueba_groq_audio || inputs.prueba_correccion_audio) && '-prueba' || '' }}
  cancel-in-progress: false

jobs:
  transcribir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar el filtro de correcciones (regresión)
        run: python tests/test_filtro_correcciones.py

      - name: Transcribir y resumir
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CARPETA_CLASES_ID: ${{ secrets.CARPETA_CLASES_ID }}
          CARPETA_RESUMENES_SPARK_ID: ${{ secrets.CARPETA_RESUMENES_SPARK_ID }}
          PRUEBA_MATERIA: ${{ inputs.prueba_materia }}
          PRUEBA_GROQ_AUDIO: ${{ inputs.prueba_groq_audio }}
          PRUEBA_CORRECCION_AUDIO: ${{ inputs.prueba_correccion_audio }}
          MAX_PENDIENTES: ${{ inputs.max_pendientes }}
          RECORREGIR_AUDIO: ${{ inputs.recorregir_audio }}
        run: python transcribir.py

      - name: Subir auditoría de la corrección (modo prueba)
        if: always() && (inputs.prueba_correccion_audio != '' || inputs.recorregir_audio != '')
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-correccion
          path: auditoria/
          if-no-files-found: ignore
